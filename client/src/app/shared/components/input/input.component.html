<div class="w-full">
  @if (label()) {
    <label class="block text-sm font-medium text-gray-700 mb-1">
      {{ label() }}
      @if (required()) {
        <span class="text-red-500">*</span>
      }
    </label>
  }
  <input
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value()"
    [disabled]="disabled()"
    [class]="'w-full px-3.5 py-2.5 border rounded-xl text-sm transition-colors focus:outline-none focus:ring-2 focus:ring-accent-500/40 focus:border-accent-500 disabled:bg-gray-100 disabled:cursor-not-allowed ' + (error() ? 'border-red-400 bg-red-50/30' : 'border-gray-200 bg-white')"
    (input)="onInput($event)"
    (blur)="onBlur()"
    (focus)="onFocus()"
  />
  @if (error()) {
    <p class="mt-1 text-sm text-red-500">{{ error() }}</p>
  }
  @if (hint() && !error()) {
    <p class="mt-1 text-sm text-gray-400">{{ hint() }}</p>
  }
</div>
