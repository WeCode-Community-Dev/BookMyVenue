<div class="flex items-center justify-between px-2 py-3">
  <p class="text-sm text-gray-600">
    Showing page {{ currentPage() }} of {{ totalPages() }} ({{ totalItems() }} items)
  </p>
  <nav class="flex items-center gap-1">
    <button
      class="px-3 py-1.5 text-sm rounded-lg border border-gray-300 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
      [disabled]="!hasPrevious()"
      (click)="previousPage()"
    >
      Previous
    </button>
    @for (page of pages(); track $index) {
      @if (page === '...') {
        <span class="px-2 py-1 text-gray-400">...</span>
      } @else {
        <button
          class="px-3 py-1.5 text-sm rounded-lg border transition-colors"
          [class]="page === currentPage() ? 'bg-indigo-600 text-white border-indigo-600' : 'border-gray-300 hover:bg-gray-50'"
          (click)="goToPage(page)"
        >
          {{ page }}
        </button>
      }
    }
    <button
      class="px-3 py-1.5 text-sm rounded-lg border border-gray-300 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
      [disabled]="!hasNext()"
      (click)="nextPage()"
    >
      Next
    </button>
  </nav>
</div>
