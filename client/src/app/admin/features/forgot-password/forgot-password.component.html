<div class="min-h-screen flex items-center justify-center bg-gray-900 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white">Forgot Password</h1>
      <p class="mt-2 text-sm text-gray-400">Reset your admin password</p>
    </div>
    <div class="bg-gray-800 rounded-xl shadow-lg border border-gray-700 p-8">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <app-input label="Email Address" type="email" formControlName="email" [required]="true"
          [error]="form.controls.email.touched && form.controls.email.errors ? 'Valid email required' : ''" />
        <div class="mt-6"><app-button label="Send Reset Code" type="submit" [loading]="loading()" [fullWidth]="true" /></div>
      </form>
      <p class="mt-6 text-center text-sm text-gray-400">
        <a routerLink="/admin/login" class="text-red-400 font-medium">Back to login</a>
      </p>
    </div>
  </div>
</div>
