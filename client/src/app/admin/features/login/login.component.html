<div class="min-h-screen flex items-center justify-center bg-surface-dark px-4 relative overflow-hidden">

  <!-- Background dot grid -->
  <div class="absolute inset-0 opacity-[0.035]"
    style="background-image: radial-gradient(circle, #C9A84C 1px, transparent 1px); background-size: 28px 28px;"></div>

  <!-- Gold glow top -->
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-150 h-75 bg-accent-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Card -->
  <div class="relative w-full max-w-md">

    <!-- Logo / Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-linear-to-br from-accent-500 to-accent-600 shadow-lg shadow-accent-500/20 mb-5">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"
            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </div>
      <h1 class="font-heading text-2xl font-bold text-white tracking-tight">BookMyVenue</h1>
      <p class="text-blue-200/40 text-xs tracking-widest uppercase font-semibold mt-1">Admin Control Panel</p>
    </div>

    <!-- Form card -->
    <div class="bg-surface-dark2 rounded-2xl border border-[#1A3050] shadow-2xl p-8">

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-blue-200/60 uppercase tracking-widest mb-1.5">
            Email Address
          </label>
          <app-input
            type="email"
            formControlName="email"
            [required]="true"
            placeholder="admin@bookmyvenue.com"
            [error]="form.controls.email.touched && form.controls.email.errors ? 'Enter a valid email address' : ''"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-blue-200/60 uppercase tracking-widest mb-1.5">
            Password
          </label>
          <app-input
            type="password"
            formControlName="password"
            [required]="true"
            placeholder="••••••••"
            [error]="form.controls.password.touched && form.controls.password.errors ? 'Minimum 6 characters' : ''"
          />
        </div>

        <div class="flex justify-end pt-1">
          <a routerLink="/admin/forgot-password"
            class="text-xs text-blue-200/50 hover:text-accent-500 transition-colors">
            Forgot password?
          </a>
        </div>

        <app-button label="Sign In to Admin" type="submit" [loading]="loading()" [fullWidth]="true" />

        @if (showVerifyButton()) {
          <app-button
            label="Verify Email"
            type="button"
            (clicked)="onVerify()"
            [fullWidth]="true"
            variant="outline"
            class="mt-3"
          />
        }
      </form>
    </div>

    <!-- Footer note -->
    <p class="text-center text-xs text-blue-200/25 mt-6">
      &copy; 2026 BookMyVenue · All activity is logged and monitored
    </p>
  </div>
</div>
