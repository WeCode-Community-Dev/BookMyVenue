<div>
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Users Management</h1>
  @if (userService.loading()) { <app-loader /> }
  @else if (userService.users().length === 0) {
    <app-empty-state title="No users" message="Users will appear here once they register." />
  } @else {
    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
      <table class="w-full text-sm text-left">
        <thead class="bg-gray-50 text-gray-600 uppercase text-xs tracking-wider">
          <tr>
            <th class="px-4 py-3">Name</th>
            <th class="px-4 py-3">Email</th>
            <th class="px-4 py-3">Phone</th>
            <th class="px-4 py-3">Joined</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          @for (user of userService.users(); track user.id) {
            <tr class="hover:bg-gray-50">
              <td class="px-4 py-3 font-medium">{{ user.name }}</td>
              <td class="px-4 py-3 text-gray-600">{{ user.email }}</td>
              <td class="px-4 py-3 text-gray-600">{{ user.phone }}</td>
              <td class="px-4 py-3 text-gray-500">{{ user.createdAt | date:'mediumDate' }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <app-pagination [currentPage]="1" [totalPages]="userService.totalPages()" (pageChanged)="onPageChange($event)" />
  }
</div>
