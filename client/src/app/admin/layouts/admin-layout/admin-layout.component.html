<div class="flex h-screen bg-gray-50">
  <aside class="bg-gray-900 text-white transition-all duration-300 flex flex-col" [class.w-64]="sidebarOpen()" [class.w-16]="!sidebarOpen()">
    <div class="flex items-center justify-between p-4 border-b border-gray-700">
      @if (sidebarOpen()) { <h1 class="text-lg font-bold text-red-400">Admin Panel</h1> }
      <button class="p-1.5 rounded-lg hover:bg-gray-800 transition-colors" (click)="toggleSidebar()">
        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
    <nav class="flex-1 py-4">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="bg-gray-800 text-white border-r-2 border-red-400"
          class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            @switch (item.icon) {
              @case ('dashboard') { <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z" /> }
              @case ('users') { <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /> }
              @case ('vendors') { <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /> }
              @case ('venues') { <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /> }
              @case ('bookings') { <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /> }
              @case ('analytics') { <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /> }
              @case ('settings') { <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /> }
            }
          </svg>
          @if (sidebarOpen()) { <span>{{ item.label }}</span> }
        </a>
      }
    </nav>
    <div class="border-t border-gray-700 p-4">
      <button class="flex items-center gap-3 w-full text-sm text-gray-300 hover:text-red-400 transition-colors" (click)="logout()">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        @if (sidebarOpen()) { <span>Logout</span> }
      </button>
    </div>
  </aside>
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-gray-900">Admin Panel</h2>
      <div class="flex items-center gap-3">
        <span class="text-sm text-gray-600">{{ currentUser()?.name }}</span>
        <div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center">
          <span class="text-sm font-medium text-red-600">{{ currentUser()?.name?.charAt(0) || 'A' }}</span>
        </div>
      </div>
    </header>
    <main class="flex-1 overflow-y-auto p-6"><router-outlet /></main>
    <footer class="bg-white border-t border-gray-200 px-6 py-3 text-center">
      <p class="text-xs text-gray-400">&copy; 2026 BookMyVenue Admin</p>
    </footer>
  </div>
</div>
