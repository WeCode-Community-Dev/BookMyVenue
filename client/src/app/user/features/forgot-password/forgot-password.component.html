<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Forgot Password</h1>
      <p class="mt-2 text-sm text-gray-600">Enter your email to receive a reset code</p>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="space-y-4">
          <app-input
            label="Email Address"
            type="email"
            placeholder="you@example.com"
            formControlName="email"
            [required]="true"
            [error]="form.controls.email.touched && form.controls.email.errors ? 'Valid email is required' : ''"
          />
        </div>

        <div class="mt-6">
          <app-button
            label="Send Reset Code"
            type="submit"
            [loading]="loading()"
            [fullWidth]="true"
          />
        </div>
      </form>

      <p class="mt-6 text-center text-sm text-gray-600">
        Remember your password?
        <a routerLink="/login" class="text-indigo-600 font-medium hover:text-indigo-500">Sign in</a>
      </p>
    </div>
  </div>
</div>
