<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Reset Password</h1>
      <p class="mt-2 text-sm text-gray-600">Enter the OTP sent to your email and create a new password</p>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="space-y-4">
          <app-input
            label="Email Address"
            type="email"
            placeholder="you@example.com"
            formControlName="email"
            [required]="true"
            [error]="form.controls.email.touched && form.controls.email.errors ? 'Valid email is required' : ''"
          />

          <app-input
            label="Verification Code"
            placeholder="123456"
            formControlName="otp"
            [required]="true"
            [error]="form.controls.otp.touched && form.controls.otp.errors ? 'Enter the 6-digit code' : ''"
          />

          <app-input
            label="New Password"
            type="password"
            placeholder="Min. 8 characters"
            formControlName="newPassword"
            [required]="true"
            [error]="form.controls.newPassword.touched && form.controls.newPassword.errors ? 'Min. 8 characters with uppercase, lowercase, number & special character' : ''"
          />

          <app-input
            label="Confirm New Password"
            type="password"
            placeholder="Re-enter your new password"
            formControlName="confirmPassword"
            [required]="true"
            [error]="form.controls.confirmPassword.touched && form.controls.confirmPassword.errors ? 'Passwords do not match' : ''"
          />
        </div>

        <div class="mt-6">
          <app-button
            label="Reset Password"
            type="submit"
            [loading]="loading()"
            [fullWidth]="true"
          />
        </div>
      </form>

      <p class="mt-6 text-center text-sm text-gray-600">
        Remember your password?
        <a routerLink="/login" class="text-indigo-600 font-medium hover:text-indigo-500">Sign in</a>
      </p>
    </div>
  </div>
</div>
