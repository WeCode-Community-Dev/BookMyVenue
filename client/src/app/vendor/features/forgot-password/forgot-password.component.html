<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Forgot Password</h1>
      <p class="mt-2 text-sm text-gray-600">We'll send a reset link to your email</p>
    </div>
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <app-input label="Email Address" type="email" formControlName="email" [required]="true"
          [error]="form.controls.email.touched && form.controls.email.errors ? 'Valid email required' : ''" />
        <div class="mt-6">
          <app-button label="Send Reset Link" type="submit" [loading]="loading()" [fullWidth]="true" />
        </div>
      </form>
      <p class="mt-6 text-center text-sm text-gray-600">
        <a routerLink="/vendor/login" class="text-indigo-600 font-medium">Back to login</a>
      </p>
    </div>
  </div>
</div>
