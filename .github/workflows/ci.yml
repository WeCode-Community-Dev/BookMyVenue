name: CI

on: 
  push:
   branches: [main, dev]
  pull_request:
   branches: [main, dev]

jobs:
  build-and-test:
   runs-on: ubuntu-latest

   steps:
   - name: Checkout Repository
     uses: actions/checkout@v4

   - name: install pnpm
     uses: pnpm/action-setup@v4
     with:
      version: 10.17.1
   - name: Setup Node js 
     uses: actions/setup-node@v4  
     with:
      node-version: 22
      cache: 'pnpm'

   - name: Install Dependencies
     run: pnpm install --frozen-lockfile


   - name: Run Linter
     run: pnpm lint

   - name: Run Typecheck
     run: pnpm typecheck

   - name: Run Tests
     run: pnpm test      
     
   - name: Run Build
     run: pnpm build