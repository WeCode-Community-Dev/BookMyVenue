name: BookMyVenue CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    # Example test script, assuming pytest is used eventually
    - name: Run Backend Tests (Placeholder)
      run: |
        echo "Running backend tests..."
        # cd backend && pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "20.x"
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    - name: Build frontend
      run: |
        cd frontend
        npm run build
    - name: Lint frontend
      run: |
        cd frontend
        npm run lint

  payment-service-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    - name: Install payment service dependencies
      run: |
        python -m pip install --upgrade pip
        cd payment-service
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run Payment Service Tests (Placeholder)
      run: |
        echo "Running payment service tests..."
        # cd payment-service && pytest
