name: Background Jobs

# Triggers the API's background jobs at their original cadences by calling the
# token-guarded POST /api/internal/run-jobs endpoint. The in-process scheduler
# stays off (ENABLE_JOBS=false) so the free Render service can sleep.
#
# The cron -> job-set mapping lives in apps/api/app/jobs/schedule.json (the
# single source of truth, also read by the admin Settings page). The cron
# strings below MUST match that file exactly — GitHub requires `on.schedule`
# entries to be literal, so they can't be generated from it, only kept in sync.
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 * * * *"
    - cron: "0 */6 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: "Comma-separated job names to run"
        required: true
        default: "hold_expiry,payment_reminders,request_expiry,overdue_flag,overdue_autocancel,completion,search_indexer,invoice_generator,payment_pending_expiry"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select job set
        id: select
        run: |
          if [ -n "${{ github.event.schedule }}" ]; then
            JOBS=$(jq -r --arg cron "${{ github.event.schedule }}" \
              '.schedules[] | select(.cron == $cron) | .jobs | join(",")' \
              apps/api/app/jobs/schedule.json)
          else
            JOBS="${{ github.event.inputs.jobs }}"
          fi
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"
          echo "Running jobs: $JOBS"

      - name: Warm up (ride out free-tier cold start)
        run: curl -fsS --max-time 90 --retry 5 --retry-all-errors --retry-delay 12 "${{ secrets.API_BASE_URL }}/health"

      - name: Trigger jobs
        run: |
          curl -fsS --max-time 300 -X POST \
            -H "X-Job-Token: ${{ secrets.JOB_RUNNER_TOKEN }}" \
            "${{ secrets.API_BASE_URL }}/api/internal/run-jobs?jobs=${{ steps.select.outputs.jobs }}"
