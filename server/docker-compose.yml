
services:
  postgres:
    image: postgres:16
    container_name: bookmyvenue-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5431:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: